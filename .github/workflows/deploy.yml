name: Deploy SMMPanels.net Astro App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            whoami
            pwd

            node -v
            npm -v

            which node
            which npm
            
            cd var/www/hosted_projects/SMMPanels.net/SMMPanels.net-Upgrade/

            node -v
            npm -v

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building Astro..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart "SMMPanels.net"

            echo "Deployment completed successfully!"